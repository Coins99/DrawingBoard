<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Finger Drawing Tracker with Thumb-Pinky Control</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- MediaPipe Hands (global API) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
  <h2>Finger Drawing Tracker</h2>

  <div id="controls">
    <div class="label-inline">
      <label>White Canvas</label>
      <label class="switch">
        <input type="checkbox" id="whiteBgToggle">
        <span class="slider"></span>
      </label>
    </div>

    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop & Score</button>
    <button id="resetBtn">Reset</button>

    <label class="label-inline">
      <input id="debugToggle" type="checkbox" checked>
      Debug
    </label>

    <span id="status"></span>
  </div>

  <video id="video" width="640" height="480" autoplay playsinline></video>
  <canvas id="canvas" width="640" height="480"></canvas>
  <div id="score">Score: N/A</div>

  <script src="app.js"></script>
</body>
</html>
