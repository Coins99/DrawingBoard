<svg xmlns="http://www.w3.org/2000/svg" width="520" height="132" viewBox="0 0 520 132" role="img" aria-label="DrawingBoard">
  <title>DrawingBoard</title>
  <defs>
    <marker id="tip" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- A rectangle, a diamond and a circle joined by connectors: the editor's own vocabulary. -->
  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#tip)">
    <path d="M52 40 H78"/>
    <path d="M52 92 H78"/>
  </g>

  <rect x="8" y="24" width="44" height="32" rx="7" fill="#eff4ff" stroke="#2563eb" stroke-width="3"/>
  <polygon points="100,26 126,44 100,62 74,44" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <circle cx="30" cy="92" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>

  <!-- The freehand stroke that recognition turns into one of the shapes above. -->
  <path d="M74 104 c10 -14 22 6 32 -8 c8 -11 18 4 26 -6"
        fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 4"/>

  <text x="152" y="60" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#182230">DrawingBoard</text>
  <text x="154" y="90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#64748b">Sketch a diagram. Edit the diagram.</text>
</svg>
